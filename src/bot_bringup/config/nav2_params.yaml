amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      min_vel_x: -0.5
      max_vel_x: 0.5

      min_vel_y: -0.5
      max_vel_y: 0.5

      max_vel_theta: 1.0
      min_vel_theta: -1.0

      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -2.0

      vx_samples: 10
      vy_samples: 10
      vtheta_samples: 20

      sim_time: 1.5

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 4.0
      height: 4.0
      resolution: 0.05

      robot_radius: 0.30

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.30
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05

      robot_radius: 0.30

      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.30
        cost_scaling_factor: 3.0

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_rf2o

behavior_server:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
