amcl:
  ros__parameters:

    use_sim_time: false

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"

    laser_max_range: 12.0
    laser_min_range: 0.15

    max_beams: 360

    min_particles: 500
    max_particles: 2000

    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.10
    update_min_a: 0.10

    resample_interval: 1

    transform_tolerance: 0.5

    set_initial_pose: false

    first_map_only: false

    tf_broadcast: true

    do_beamskip: false

    scan_match: true
